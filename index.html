<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>3D Viewer 360</title>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#111318;color:#eee;font:14px system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#1a1d24;border-bottom:1px solid #2a2e38}
  header .t{flex:1;min-width:0}
  #name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info{font-size:11px;color:#8b93a5}
  button,label.btn{display:inline-flex;align-items:center;justify-content:center;background:#262b36;color:#eee;border:1px solid #343a48;border-radius:10px;padding:10px 12px;font:inherit;min-height:42px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .primary{background:#3b6cff!important;border-color:#3b6cff!important;font-weight:600}
  button.on{background:#3b6cff55;border-color:#3b6cff}
  #stage{flex:1;position:relative;min-height:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #tools{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#1a1d24;border-top:1px solid #2a2e38;overflow-x:auto}
  #tools button{flex:0 0 auto}
  #msg{position:absolute;left:10px;right:10px;top:10px;background:#000c;padding:10px 12px;border-radius:10px;white-space:pre-line;display:none;z-index:5}
  #msg.err{background:#7a1f1fe6}
  #empty{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;pointer-events:none}
  #empty label{background:#000a;padding:8px 14px;border-radius:20px;color:#cfd6e6;pointer-events:auto;cursor:pointer}
  /* file input: kept in layout (not display:none) so mobile browsers open the picker reliably */
  .fin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
  #tools label{flex:0 0 auto;white-space:nowrap}
  #orient{display:none;position:absolute;left:8px;right:8px;bottom:8px;background:#14171de8;border:1px solid #343a48;border-radius:14px;padding:8px;z-index:4;backdrop-filter:blur(6px);max-width:560px;margin:0 auto}
  #orient.open{display:block}
  #orient .row{display:flex;align-items:center;gap:6px;margin:4px 0}
  #orient .row button{min-height:36px;padding:6px 9px;font-size:13px}
  #orient .ax{width:16px;font-weight:700;text-align:center}
  #orient input[type=range]{flex:1;min-width:60px;accent-color:#3b6cff}
  #orient .val{width:44px;text-align:right;font-size:12px;color:#aab}
  #orient .head{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  #orient .head button{min-height:36px;padding:6px 10px;font-size:13px}
  #orient .sp{flex:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="t"><div id="name">3D Viewer 360</div><div id="info"></div></div>
    <label class="btn primary" for="file" id="open">Open file</label>
  </header>
  <div id="stage">
    <div id="msg"></div>
    <div id="empty"><label for="file">SKP · GLB · GLTF · OBJ · STL · PLY · FBX · DAE · 3MF</label></div>
    <div id="orient">
      <div class="head">
        <button id="zup" class="primary">Z-up → Y-up</button>
        <button id="flip">Flip</button>
        <button id="oreset">Reset</button>
        <button id="oraw">Raw</button>
        <span class="sp"></span>
        <button id="oclose" aria-label="Close">✕</button>
      </div>
      <div class="row"><span class="ax">X</span>
        <button data-ax="x" data-d="-90">−90</button><button data-ax="x" data-d="-5">−5</button>
        <input type="range" id="sx" min="-180" max="180" step="1" value="0">
        <button data-ax="x" data-d="5">+5</button><button data-ax="x" data-d="90">+90</button><span class="val" id="vx">0°</span></div>
      <div class="row"><span class="ax">Y</span>
        <button data-ax="y" data-d="-90">−90</button><button data-ax="y" data-d="-5">−5</button>
        <input type="range" id="sy" min="-180" max="180" step="1" value="0">
        <button data-ax="y" data-d="5">+5</button><button data-ax="y" data-d="90">+90</button><span class="val" id="vy">0°</span></div>
      <div class="row"><span class="ax">Z</span>
        <button data-ax="z" data-d="-90">−90</button><button data-ax="z" data-d="-5">−5</button>
        <input type="range" id="sz" min="-180" max="180" step="1" value="0">
        <button data-ax="z" data-d="5">+5</button><button data-ax="z" data-d="90">+90</button><span class="val" id="vz">0°</span></div>
    </div>
  </div>
  <div id="tools">
    <label class="btn" for="file2" id="open2">Open (alt)</label>
    <label class="btn" for="file3" id="open3">+ MTL / textures</label>
    <button id="rotbtn">Rotate / Orient</button>
    <button id="rot">Auto-rotate 360</button>
    <button id="home">Reset view</button>
    <button id="wire">Wireframe</button>
    <button id="grid">Hide grid</button>
    <button id="bg">Background</button>
    <button id="shot">Save PNG</button>
  </div>
  <input id="file" class="fin" type="file">
  <input id="file2" class="fin" type="file" accept=".skp,.stl,.obj,.glb,.gltf,.ply,.fbx,.dae,.3mf,.mtl,model/*,application/octet-stream">
  <input id="file3" class="fin" type="file" multiple>
</div>
